name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / pytest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Check package imports
        run: |
          python -c "from HAOA.algorithm.haoa import HAOA"
          python -c "from HAOA.experiments.benchmark_manager import BenchmarkManager; assert len(BenchmarkManager().get_all_benchmarks()) == 5"
      - name: Run complete benchmark suite and HAOA-vs-PSO comparison
        if: matrix.python-version == '3.11'
        run: |
          python -m HAOA.experiments.full_runner
          python -m HAOA.experiments.dataset_comparison
          python - <<'PY'
          import csv
          from pathlib import Path

          summary = Path("HAOA/results/csv/summary.csv")
          convergence = Path("HAOA/results/csv/convergence.csv")
          comparison = Path("HAOA/results/benchmark_comparison.csv")
          expected = [
              Path("HAOA/results/Ackley_comparison.png"),
              Path("HAOA/results/Griewank_comparison.png"),
              Path("HAOA/results/Rastrigin_comparison.png"),
              Path("HAOA/results/Rosenbrock_comparison.png"),
          ]
          for path in [summary, convergence, comparison, *expected]:
              assert path.is_file() and path.stat().st_size > 0, f"Missing output: {path}"

          with comparison.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 4, f"Expected 4 comparison benchmarks, got {len(rows)}"
          for row in rows:
              assert row["Benchmark"]
              assert float(row["HAOA Score"]) >= 0
              assert float(row["PSO Score"]) >= 0
          print("Full benchmark and HAOA-vs-PSO comparison outputs verified.")
          PY
